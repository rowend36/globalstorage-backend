name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Validate shell scripts
        run: bash -n docker/entrypoint.sh scripts/*.sh

      - name: Validate Compose files
        run: |
          cp .env.example .env
          cp .env.production.example .env.production
          cp .env.preview.example .env.preview
          mkdir -p data/nginx data/certbot-webroot data/mail-config
          touch data/nginx/default.conf
          docker compose --env-file .env -f compose.mail.yml config
          docker compose --env-file .env --env-file .env.production.example -f compose.production.yml config
          docker compose --env-file .env --env-file .env.preview.example -f compose.preview.yml config
          docker compose --env-file .env -f compose.gateway.yml config

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish preview dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          target: preview-dependencies
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:preview-dependencies

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:production

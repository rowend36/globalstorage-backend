services:
  preview-api:
    image: ${PREVIEW_DEPENDENCIES_IMAGE:?PREVIEW_DEPENDENCIES_IMAGE is required}
    working_dir: /app
    command: >-
      sh -c "npm run migration:up:pg && npm run start:dev"
    env_file:
      - .env
      - .env.preview
    environment:
      NODE_ENV: development
      DATABASE_DRIVER: postgresql
      DB_HOST: preview-postgres
      DB_PORT: 5432
      REDIS_URL: redis://preview-redis:6379
      QUEUE_REDIS_URL: redis://preview-redis:6379
      SMTP_URL: smtp://${SMTP_USER}:${SMTP_PASSWORD}@${MAIL_HOST}:587
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - .:/app
      - preview_node_modules:/app/node_modules
      - preview_uploads:/app/uploads
    networks:
      app: {}
      gateway:
        aliases: [preview-api]
      mail:
        aliases: [preview-api]
    depends_on:
      preview-postgres:
        condition: service_healthy
      preview-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  preview-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-globalstorage_preview}
      POSTGRES_USER: ${DB_USER:-globalstorage_preview}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - preview_postgres:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  preview-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - preview_redis:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  preview_node_modules:
    name: globalstorage-backend_preview_node_modules
  preview_uploads:
    name: globalstorage-backend_preview_uploads
  preview_postgres:
  preview_redis:

networks:
  app:
  gateway:
    external: true
    name: globalstorage-gateway
  mail:
    external: true
    name: globalstorage-mail
